name: Deploy Content to loganalytic-workspace [2f8ef96b-83a4-4e5b-a3df-53bb01144a9e]
# Note: This workflow will deploy everything in the root directory.
# To deploy content only from a specific path (for example SentinelContent):
#   1. Add the target path to the "paths" property like such
#    paths:
#    - 'SentinelContent/**'
#    - '!.github/workflows/**'
#    - '.github/workflows/sentinel-deploy-2f8ef96b-83a4-4e5b-a3df-53bb01144a9e.yml'
#   2. Append the path to the directory environment variable below
#       directory: '${{ github.workspace }}/SentinelContent'

on:
  push:
    branches: [ master ]
    paths:
    - '**'
    - '!.github/workflows/**'  # this filter prevents other workflow changes from triggering this workflow
    - '.github/workflows/sentinel-deploy-2f8ef96b-83a4-4e5b-a3df-53bb01144a9e.yml'

jobs:
  deploy-content:
    runs-on: windows-latest
    env:
      resourceGroupName: 'secops-rg'
      workspaceName: 'loganalytic-workspace'
      workspaceId: 'df3022e5-f224-4c0e-8d28-f53385132bf2'
      directory: '${{ github.workspace }}'
      cloudEnv: 'AzureCloud'
      contentTypes: 'AnalyticsRule,AutomationRule,HuntingQuery,Playbook,Workbook'
      branch: 'master'
      sourceControlId: '2f8ef96b-83a4-4e5b-a3df-53bb01144a9e'
      rootDirectory: '${{ github.workspace }}'
      githubAuthToken: ${{ secrets.GITHUB_TOKEN }}
      smartDeployment: 'true'
    permissions:
      contents: write
      id-token: write # Require write permission to Fetch an OIDC token.

    steps:
    - name: Login to Azure (Attempt 1)
      continue-on-error: true
      id: login1
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_2f8ef96b83a44e5ba3df53bb01144a9e }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_2f8ef96b83a44e5ba3df53bb01144a9e }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_2f8ef96b83a44e5ba3df53bb01144a9e }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 1 failed
      if: ${{ steps.login1.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 2)
      continue-on-error: true
      id: login2
      uses: azure/login@v2
      if: ${{ steps.login1.outcome=='failure' }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_2f8ef96b83a44e5ba3df53bb01144a9e }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_2f8ef96b83a44e5ba3df53bb01144a9e }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_2f8ef96b83a44e5ba3df53bb01144a9e }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 2 failed
      if: ${{ steps.login2.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 3)
      continue-on-error: false
      id: login3
      uses: azure/login@v2
      if: ${{ steps.login2.outcome=='failure'  }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_2f8ef96b83a44e5ba3df53bb01144a9e }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_2f8ef96b83a44e5ba3df53bb01144a9e }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_2f8ef96b83a44e5ba3df53bb01144a9e }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Checkout
      uses: actions/checkout@v3

    - name: Deploy Content to Microsoft Sentinel
      uses: azure/powershell@v2
      with:
        azPSVersion: 'latest'
        inlineScript: |
          ${{ github.workspace }}//.github/workflows/azure-sentinel-deploy-2f8ef96b-83a4-4e5b-a3df-53bb01144a9e.ps1